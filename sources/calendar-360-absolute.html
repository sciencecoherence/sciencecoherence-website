<!-- Preserved: "The Absolute Variable Space Clock", fourth of four attempts.
     Two real advances over its predecessors: the daily midnight anchor is gone,
     and the orbital scalar genuinely enters the clock expression.
     Superseded because `livingMs = totalMs / scalar` divides an accumulated
     total by an instantaneous rate. Elapsed time on a variable-rate clock is
     the integral of dt/f(t); the shortcut re-scales the whole history whenever
     f moves, so day length drifts from 0.81-1.12 of nominal in year one to
     0.40-1.52 by year five, and reverses in year nine.
     The corrected closed-form integrator runs on the article page. -->
